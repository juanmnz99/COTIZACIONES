name: Asegurar index.html

on:
  push:
    branches: [main]

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar el .html de la raíz a index.html si hace falta
        run: |
          if [ ! -f index.html ]; then
            candidato=$(ls *.html *.htm 2>/dev/null | grep -vi '^index\.html$' | head -n1)
            if [ -n "$candidato" ]; then
              echo "No hay index.html. Copiando '$candidato' -> index.html"
              cp "$candidato" index.html
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add index.html
              git commit -m "Auto: crear index.html a partir de $candidato"
              git push
            else
              echo "No se encontró ningún archivo .html en la raíz para copiar."
            fi
          else
            echo "index.html ya existe, no hace falta hacer nada."
          fi
